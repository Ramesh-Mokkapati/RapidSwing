# Publishes the demonstration website to GitHub Pages: a landing page with screenshots and downloads, and the
# demo app running in the browser. Enable it once under Settings > Pages > Source: GitHub Actions.
# Linux jobs use ubuntu-24.04 rather than ubuntu-latest, which moves to Ubuntu 26.04 from October 2026;
# switch once the new image is confirmed to work (it must still provide Maven).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build the demo jar
        run: bash ./build.sh --skip-tests -- --batch-mode --no-transfer-progress

      - name: Assemble the site
        run: bash ./site/assemble.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
